# The public site (website/) is built from the repo: docs/ markdown, README.md,
# the milestones, issues, and merged PRs from the GitHub API, and website/content/.
# PRs that touch the site or the docs lint, build, and check it; pushes to main
# deploy it to the Cloudflare Pages project `life-framework` and check the live site.
name: website

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/website.yml"
  schedule:
    # Daily, so the roadmap page follows issue changes that touch no file.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  # PR runs cancel each other; main runs queue, so a busy merge day still deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every route answers with its own prerendered page, old addresses redirect,
      # unknown ones 404, and every link, anchor, asset, and repo file link resolves.
      - name: route and link check
        run: npm run check
      - name: deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=life-framework --branch=main --commit-hash=${{ github.sha }}
      - name: check the live site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/check-routes.mjs https://life-framework-arn.pages.dev
