name: Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature discussion often starts on [Discord](https://discord.com/invite/MjMexJteqz).
        Open an issue here when you want a persistent tracker or are ready to implement.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What player or server-owner pain does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work in-game?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (with tests where applicable)
          required: false
