  "It is a small town. People here know each other, and they remember faces. Stay honest and you will do well."
  "The post office always needs couriers. For anything else, read the town board. It lists who is hiring."
  "You were paid in cash. Cash in a pocket is lost if you die. Money in the bank is not. Deposit some at the cash machine on the bank wall, next to the post office."
  "Now read the town board on the square, right beside me. It shows where everything in town is."
  "Good day to you."
  "Welcome. Here is something to start you off. The town is yours now. The shops, the car lot, the police station and the organization office are all on the town board."
  "Good day. This is the town clerk's desk. What can I do for you?"
  "You are settled in. The town board on the square shows the rest: the shops, the car lot, the police station and the organization office."
  "There. Your name is in the register, and this is your identity card. Keep it on you. The police may ask to see it."
  "Goodbye."
  "I have lost my identity card."
  "I am new in {town}."
  "What should I do now?"
  "Tell me about this {town}."
  "Where can I find work?"
  "Time to earn your first wages. The post office is down the street. Take courier work at the counter, pick up a parcel, carry it to the drop at the east end of the street, and complete the run."
  "This is the only fuel in town, friend. Petrol at the pumps, oil and maps in here."
  "Please, I am not a hero. I will not call anyone, I swear it. Just take it."
  "Drive safe. Mind the potholes on the coast road."
  "Army trucks on the coast road again, all night long. Nobody tells us anything. My mother says it is like sixty eight."
  "Quiet as a church. A tractor at nine, the post van at noon, and now you. The radio says rain by Thursday."
  "He is gone? Oh God. Somebody call the police!"
  "Hello. Pump two sticks, so use pump one. What can I do for you?"
  "There! That is all of it, all of it! Take it and go, please, just go!"
  "Police! In here! He has a gun! Help me!"
  "It is empty! I swear on my mother, the boss took the cash to the bank. Look, look, there is nothing!"
  "Oh God. Oh God, thank you. Just go. Please, just go."
  "Yes! Yes, I am opening it. The key, where is the... here, here it is. Just do not shoot, please, I am doing it!"
  "W-what? No, no, no. Please, put that away. I have a little girl at home. Please do not shoot me!"
  "Goodbye."
  "Quiet day?"
  "Open the till. Now, or you die behind that counter."
  "Anything happening in {town}?"
  "Forget it. You never saw me."
  "This is a robbery. Hands where I can see them!"
  "Hey, where are we?"
  "My hands, I cannot stop my hands. It is coming, it is almost open, please..."
