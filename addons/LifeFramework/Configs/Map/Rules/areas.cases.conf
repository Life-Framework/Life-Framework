LF_Test_MapAreasCases {
 m_sJson "{\"rule\":\"areas\",\"version\":1,\"about\":\"Shared case table for the map area rules (everon-map.md section 8). LF_Test_MapAreas (Enforce, LF_MapAreas) and tools/map/rules/areas.mjs evaluate() (node) both run it. Coordinates are world metres, flat; a list is 'x z x z ...'. A yaw is degrees: a box turns like LF_ZoneArea.Contains turns it (world = rotate(local, yaw)). A corridor is the zone polyline buffered by its half-width: left side forward, right side back, mitred bends, flat caps. Node rounds to 0.01; the Enforce test matches within 'tolerance'. A style 'kind' is an LF_MapAreaStyle name; a 'rule' is an LF_ZoneRule name.\",\"tolerance\":0.011,\"cases\":[{\"name\":\"a polygon keeps its points, in order\",\"input\":{\"op\":\"outline\",\"shape\":\"polygon\",\"points\":\"0 0 50 0 50 30 0 30\"},\"expect\":{\"outline\":\"0 0 50 0 50 30 0 30\",\"centroid\":\"25 15\"}},{\"name\":\"a triangle's label sits at its centroid\",\"input\":{\"op\":\"outline\",\"shape\":\"polygon\",\"points\":\"0 0 30 0 0 30\"},\"expect\":{\"outline\":\"0 0 30 0 0 30\",\"centroid\":\"10 10\"}},{\"name\":\"a polygon with two points is refused\",\"input\":{\"op\":\"outline\",\"shape\":\"polygon\",\"points\":\"0 0 50 0\"},\"expect\":{\"outline\":\"\",\"centroid\":\"\"}},{\"name\":\"a circle is a 4-gon when asked, counter-clockwise from +x\",\"input\":{\"op\":\"outline\",\"shape\":\"circle\",\"center\":\"100 200\",\"radius\":10,\"segments\":4},\"expect\":{\"outline\":\"110 200 100 210 90 200 100 190\",\"centroid\":\"100 200\"}},{\"name\":\"a circle is a 32-gon by default\",\"input\":{\"op\":\"outline\",\"shape\":\"circle\",\"center\":\"100 200\",\"radius\":10},\"expect\":{\"outline\":\"110 200 109.81 201.95 109.24 203.83 108.31 205.56 107.07 207.07 105.56 208.31 103.83 209.24 101.95 209.81 100 210 98.05 209.81 96.17 209.24 94.44 208.31 92.93 207.07 91.69 205.56 90.76 203.83 90.19 201.95 90 200 90.19 198.05 90.76 196.17 91.69 194.44 92.93 192.93 94.44 191.69 96.17 190.76 98.05 190.19 100 190 101.95 190.19 103.83 190.76 105.56 191.69 107.07 192.93 108.31 194.44 109.24 196.17 109.81 198.05\",\"centroid\":\"100 200\"}},{\"name\":\"a circle with no radius is refused\",\"input\":{\"op\":\"outline\",\"shape\":\"circle\",\"center\":\"100 200\",\"radius\":0},\"expect\":{\"outline\":\"\",\"centroid\":\"\"}},{\"name\":\"a box at yaw 0 is axis aligned\",\"input\":{\"op\":\"outline\",\"shape\":\"box\",\"center\":\"100 200\",\"half\":\"20 5\",\"yaw\":0},\"expect\":{\"outline\":\"80 195 120 195 120 205 80 205\",\"centroid\":\"100 200\"}},{\"name\":\"a box at yaw 90 has its long side along z\",\"input\":{\"op\":\"outline\",\"shape\":\"box\",\"center\":\"100 200\",\"half\":\"20 5\",\"yaw\":90},\"expect\":{\"outline\":\"105 180 105 220 95 220 95 180\",\"centroid\":\"100 200\"}},{\"name\":\"a box at yaw 180 is the same box turned round\",\"input\":{\"op\":\"outline\",\"shape\":\"box\",\"center\":\"100 200\",\"half\":\"20 5\",\"yaw\":180},\"expect\":{\"outline\":\"120 205 80 205 80 195 120 195\",\"centroid\":\"100 200\"}},{\"name\":\"a box at yaw 45 stands on its corner\",\"input\":{\"op\":\"outline\",\"shape\":\"box\",\"center\":\"0 0\",\"half\":\"10 10\",\"yaw\":45},\"expect\":{\"outline\":\"0 -14.14 14.14 0 0 14.14 -14.14 0\",\"centroid\":\"0 0\"}},{\"name\":\"a box with no width is refused\",\"input\":{\"op\":\"outline\",\"shape\":\"box\",\"center\":\"0 0\",\"half\":\"20 0\",\"yaw\":0},\"expect\":{\"outline\":\"\",\"centroid\":\"\"}},{\"name\":\"a two-point corridor is a flat-capped strip\",\"input\":{\"op\":\"outline\",\"shape\":\"corridor\",\"points\":\"0 0 100 0\",\"radius\":3},\"expect\":{\"outline\":\"0 3 100 3 100 -3 0 -3\",\"centroid\":\"50 0\"}},{\"name\":\"a corridor bend is mitred\",\"input\":{\"op\":\"outline\",\"shape\":\"corridor\",\"points\":\"0 0 100 0 100 100\",\"radius\":3},\"expect\":{\"outline\":\"0 3 97 3 97 100 103 100 103 -3 0 -3\",\"centroid\":\"75.02 24.98\"}},{\"name\":\"a one-point corridor is a circle\",\"input\":{\"op\":\"outline\",\"shape\":\"corridor\",\"points\":\"10 10\",\"radius\":5,\"segments\":4},\"expect\":{\"outline\":\"15 10 10 15 5 10 10 5\",\"centroid\":\"10 10\"}},{\"name\":\"a corridor with no points is refused\",\"input\":{\"op\":\"outline\",\"shape\":\"corridor\",\"points\":\"\",\"radius\":3},\"expect\":{\"outline\":\"\",\"centroid\":\"\"}},{\"name\":\"style SAFE\",\"input\":{\"op\":\"style\",\"kind\":\"SAFE\"},\"expect\":{\"kind\":\"SAFE\",\"fillToken\":\"map-area-safe-fill\",\"fillAlpha\":15,\"hatch\":\"none\",\"lineToken\":\"map-area-safe-line\",\"lineWidth\":2,\"dash\":\"solid\",\"labelKey\":\"#LF-Map_AreaSafe\"}},{\"name\":\"style LAWLESS\",\"input\":{\"op\":\"style\",\"kind\":\"LAWLESS\"},\"expect\":{\"kind\":\"LAWLESS\",\"fillToken\":\"map-area-lawless-fill\",\"fillAlpha\":25,\"hatch\":\"diagonal\",\"lineToken\":\"map-area-lawless-line\",\"lineWidth\":4,\"dash\":\"heavy-dash\",\"labelKey\":\"#LF-Map_AreaLawless\"}},{\"name\":\"style TOWN\",\"input\":{\"op\":\"style\",\"kind\":\"TOWN\"},\"expect\":{\"kind\":\"TOWN\",\"fillToken\":\"map-area-town-fill\",\"fillAlpha\":0,\"hatch\":\"none\",\"lineToken\":\"map-area-town-line\",\"lineWidth\":1,\"dash\":\"dash\",\"labelKey\":\"\"}},{\"name\":\"style GATED\",\"input\":{\"op\":\"style\",\"kind\":\"GATED\"},\"expect\":{\"kind\":\"GATED\",\"fillToken\":\"map-area-gated-fill\",\"fillAlpha\":20,\"hatch\":\"cross\",\"lineToken\":\"map-area-gated-line\",\"lineWidth\":2,\"dash\":\"solid\",\"labelKey\":\"#LF-Map_AreaGated\"}},{\"name\":\"style EVENT\",\"input\":{\"op\":\"style\",\"kind\":\"EVENT\"},\"expect\":{\"kind\":\"EVENT\",\"fillToken\":\"map-area-event-fill\",\"fillAlpha\":20,\"hatch\":\"none\",\"lineToken\":\"map-area-event-line\",\"lineWidth\":2,\"dash\":\"dash\",\"labelKey\":\"\"}},{\"name\":\"style CUSTOM\",\"input\":{\"op\":\"style\",\"kind\":\"CUSTOM\"},\"expect\":{\"kind\":\"CUSTOM\",\"fillToken\":\"map-area-custom-fill\",\"fillAlpha\":0,\"hatch\":\"none\",\"lineToken\":\"map-area-custom-line\",\"lineWidth\":1,\"dash\":\"solid\"