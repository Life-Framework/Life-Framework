 Texts {
  "Everon Life"
  "Mining area"
  "Iron, copper, and gold ore in the rocks here. The furnace stands next to them."
  "Swing your pickaxe at the rock. Every few swings a nugget breaks off and drops at your feet; pick it up. At the furnace, use Smelt Iron Nuggets or Smelt Gold Nuggets."
  "A pickaxe in your hands."
  "A rock runs out after a few nuggets and crumbles. It grows back after a few minutes."
  "Police only"
  "A police post. Only whitelisted officers may use it."
  "A police whitelist from the server staff."
  "Civil Registry of Everon, Form R-89"
  "Republic of Everon, Identity Card"
  "FIRST BANK OF EVERON"
  "Welcome to Everon, Town Board"
  "Find work at the *post office*|Deliver, then bank your pay at the *ATM*|Spend it in town. One street runs east from this square, and every place in town stands on it"
  "Walking east, on your left: post office, bank and ATM, vehicle lot, garage, hospital, organization office, then an alley north to the back room and a walled yard|On your right: general store, market stalls, police station with the jail behind it, fuel station|The farm is north of this square|The quarry is south of the street|The barn is at the end of the dirt track east"
  "*Talk to the clerk* on this square: he hands you your ID card|*Take courier work* at the post office counter for your first wage"
  "Cash you carry stays on your body if you die|Money in the bank is safe|A crime makes you wanted"
  "Post office"
  "Delivery work for cash. Everyone starts as a courier."
  "At the counter: *Take courier work*, then *Pick up parcel*|Carry it to the drop on the porch past the lock-up, east end of the street on the right, and *Complete the run*|Out of work? *Collect benefit*"
  "Courier work is open to all|Fuel delivery needs work level 2, taxi work level 3|Every paid run counts toward your level"
  "A courier run pays $40, fuel $60, a taxi fare $80, in cash|Abandon the run and you get nothing|The benefit is $100 when your bank balance is under $500, once every 20 minutes"
  "Teller"
  "Your bank account. Jobs and sales pay cash; this is where cash goes in and out."
  "Talk to the teller, then Deposit or Withdraw."
  "Cash in your pockets to deposit."
  "Banked money stays yours when you die. A vehicle over $500 is paid from the account."
  "Bank"
  "The vault door on the bank's east wall. Behind it, a bag of cash."
  "*Breach* the vault|Carry off the bag that comes out"
  "A demolition charge|Civilians only"
  "Raises your wanted level and alerts the police|After a break-in the vault stays empty for a while"
  "General store"
  "Food and supplies."
  "Browse the store at the counter|Then *Buy* or *Sell*"
  "Cash."
  "Market"
  "Stalls that buy fruit, vegetables, and other goods for cash."
  "Sell Items at a stall, then move your goods into its storage. Each stall buys its own goods."
  "Something to sell: apples and plums from the farm orchard."
  "Paid in cash, a fixed price per item."
  "Vehicle lot"
  "Cars and trucks for sale. Each comes locked, with one key and its own plates."
  "*Buy vehicle* at the counter|It waits for you on the lot|Cut an extra key for $25"
  "S105 $1000|UAZ $2500|UAZ 452 $3500|Van $4000|Cargo truck $8000|Anything over $500 is paid from your bank account"
  "Whoever holds the key can drive it away."
  "Garage"
  "Keep your vehicle across server restarts."
  "Park by the doors and get out. Store vehicle is on the counter beside the doors and on the car itself (Store in garage). Retrieve vehicle puts it on the kerb in front. Read the garage ledger to see where each of your cars is."
  "A vehicle you own, standing by the doors."
  "Only the owner can store it or take it out. A car left on the street at a restart is towed to the impound lot behind the garage."
  "Police station"
  "Duty desk, wanted board, and armory of the Everon police."
  "Punch the clock on the duty desk: *Clock in* puts your own clothes and pockets in the locker and hands you the police uniform; *Clock out* gives them back|Read the wanted board beside the desk|At the armory: *Draw kit*"
  "A place on the police roster|Ask an admin to join the police"
  "Duty pays $30 a minute, in cash when you go off duty|One kit per shift|After an hour on duty a patrol officer becomes a senior officer|Got a police ticket? Pay it in cash at the punch clock: *Pay ticket*"
  "Jail"
  "The cell yard for wanted people brought in by the police."
  "Police: Send to jail on a wanted person within reach, or Put in vehicle and drive them here. The sentence starts at the cell."
  "An officer on duty."
  "The more wanted you are, the longer you stay. Walk out and you are brought back. A served sentence lowers your wanted level by one."
  "Fuel station"
  "Fuel cans for delivery work, and a till."
  "Take fuel can for a fuel delivery run. Rob the till takes the cash in it."
  "Fuel delivery work from the post office."
  "The till pays $150 to civilians, raises your wanted level, and alerts the police. It takes a minute to fill again."
  "Everon Village Hospital"
  "The village hospital: a medic duty desk, three beds, a call board and the ambulance bay|Bills are 1989 prices, cash only|Playtest: a practice patient lies on the grass between the bay and the till"
  "*Clock in* at the duty desk to take the medic kit|A medic can *Revive* a downed patient, or *Carry* them, *Load into vehicle* in the ambulance and *Put patient in bed*|Pay a treatment bill at the desk|*Breach* the cabinet for dressings, morphine, saline, and tourniquets|*Rob the till* on the porch"
  "Cash for a bill|A field dressing to Revive|A demolition charge for the cabinet"
  "Breaching the cabinet or robbing the till raises your wanted level and alerts the police."
  "Organization office"
  "Register a crew, keep a shared fund, buy upgrades."
  "Organization desk, then Found organization, Deposit cash, Withdraw cash, or Buy processing slot."
  "Cash. A processing slot costs $250 from the fund."
  "One organization per person. The founder invites and removes members."
  "Back room"
  "Equipment the general store does not sell."
  "Stand at the stall and knock (F). The price list opens: pick the handgun and pay."
  "Cash: the handgun costs 500. No licence and no contact needed, at any hour."
  "Hideout"
  "A walled yard owned by one organization."
  "Members open the gate|Inside, *Process contraband* at the machine|Keep the crew's goods in the chest: *Open hideout stash*"
  "Membership of the owning organization|Its processing slot from the organization office|Cabbages"
  "Outsiders cannot open the gate or the stash, even when the gate stands open."
  "Convoy pickup"
  "Crates of untaxed spirits, waiting for a driver."
  "Start convoy at the crates to take one, load it into a vehicle, drive to the convoy drop (the empty crate cage), and Deliver contraband there."
  "Membership of the organization that owns the hideout, and a vehicle."
  "Pays $200 cash in hand on delivery. Once you are in a vehicle, getting out before the pub or dying fails the run."
  "Convoy drop"
  "The publican buys untaxed spirits at his back door."
  "Park here, carry the crate to the empty crate cage, and Deliver contraband."
  "A crate of spirits from the barn out of town, taken with Start convoy."
  "One payment per run."
  "Farm"
  "Dirt plots to grow cabbages, a greenhouse, and an orchard."
  "Gather Apple or Gather Plum from the orchard trees. Plant Cabbage seeds in the dirt plots; the board beside them explains."
  "A picked tree and a planted plot need time to ripen."
  "Impound Lot"
  "Cars left on the street at a server restart are towed here."
  "Pay the fee and collect your vehicle at this desk. It waits in the yard, and you get a key."
  "The release fee in cash. Read the ledger at the desk for the amount."
  "Only the owner can collect. Store your car in the garage to never pay this."
  "The village is a short walk north."
  "Not on the list? The rest of the town is open to you|Work starts at the post office"
  "The town hall clerk stands a few steps east of this board|After the clerk, the post office is the first building on your left as you walk east"
  "With a parcel in hand, walk east, away from the church, to the porch past the brick-walled lock-up on the right|Then bank your pay at the ATM, next door to the east"
  "Spend it: the general store and the market stalls are across the street. The vehicle lot is further east on this side."
  "Get the bag clear before the police arrive|The police station is across the street, a little further east"
  "Sell what you gather at the market stalls next door, to the east|Cars are sold at the vehicle lot across the street"
  "Bank the cash at the ATM across the street, or spend it at the general store next door, to the west."
  "Park it at the garage, further east on this side|The fuel station is across the street, past the police station"
  "The fuel station is across the street, a little further east."
  "On duty, walk the street and bring wanted people to the jail yard behind this building."
  "Out again? Honest work is at the post office, at the west end of the street near the church."
  "The fuel cans stand east of here, by the lock-up. Carry one to the drop on the porch past the lock-up and Complete the run."
  "Want a crew of your own? The organization office is next door, to the east."
  "The alley beside this office leads north to the back room and the hideout gate."
  "The hideout gate is at the end of this alley."
  "Contraband comes from the barn at the end of the dirt track east of the village|Start the convoy there"
  "Drive west into the village, then up the alley beside the organization office to the hideout yard."
  "Bank the cash at the ATM on the main street, or spend it at the back room down the alley."
  "Sell the harvest at the market stalls on the main street, south of here."
  "Park it in the garage next door, to the west, and it will not be towed again."
  "Wanted"
  "Posters of people the police are looking for, one per crime."
  "A poster describes what the suspect wore and drove. The name goes up once the police identify them."
  "Officers on duty see where each crime happened."
  "Seen someone on a poster? Tell an officer. Officers clock in at the punch clock on the desk."
  "Organization Register - 1989 ledger"
  "Safe Zone"
  "The town square is a safe zone. Within 30 metres of the fountain nobody can hurt anyone: a shot fired on, into, or out of the square does no harm."
  "Put your weapon away on the square. Settle disputes somewhere else, or report them at the police station."
  "Beyond the square, killing anyone, resident or stranger, is murder. The killer is wanted at once, and the police get a description of their clothes, their vehicle, and the place. By order of the Everon Constabulary."
  "Read the town map board beside this one, then talk to the town hall clerk a few steps east."
  "New in town"
  "You are new in town and carry no papers. The clerk on the square keeps the register: talk to him and he hands you your ID card."
  "The town board"
  "Read the town board on the square, next to the clerk: it shows where everything in town is."
  "First wages"
  "Now earn your first wages. The post office is down the street: at the counter, Take courier work and Pick up parcel, carry it to the drop at the east end of the street, and Complete the run. Its sign tells you more."
  "Bank it"
  "Paid in cash. Cash in a pocket is lost if you die, money in the bank is not. Deposit some at the ATM on the bank wall, next to the post office."
  "Settled in"
  "Paid and banked. Go back to the clerk on the square."
  "Welcome to Everon, here is something to start with. The town is yours now: the shops, the car lot, the police station and the organization office are all on the town board."
  "The clerk writes your name in the register and hands you your ID card. Keep it on you: the police may ask to see it."
  "Dispatch"
  "Calls waiting for this service, newest first."
  "Calls come from payphones and pagers and stay until they are taken or expire."
  "Only on-duty staff of the service can read the details."
  "Need help? Use a payphone to call the service."
  "Lawless Area"
  "You are entering the quarry, the one lawless area on Everon. The server rules about starting a fight do not apply here. Gangs and contraband work this ground."
  "Stay out if you came for a quiet day. Carry only what you can afford to lose. Bring friends."
  "Outside the quarry fence line the town keeps its rules: killing anyone is murder and the police are told. Inside, the police still answer a call at their own risk. Marked by order of the Everon Constabulary."
  "The town square, south and west of here, is a safe zone."
  "Ambulance bay"
  "Where the village ambulance parks, ready to roll."
  "A medic on duty takes a call at the board, drives out, then Loads the patient into the ambulance and drives them to a bed."
  "A medic on duty to drive; a patient to carry."
  "Keep the bay clear. Do not park here."
  "The duty desk and the beds are north of the bay."
  "Quarry Works"
  "Everything the town builds from comes out of this one site: ore and stone in the pit, cement at the plant, gravel and sand at the stands, and timber at the sawmill."
  "Swing a pickaxe at the rocks and smelt the nuggets at the furnace. Buy or gather cement, gravel and sand from the three stands. Fell a pine and carry the log to the sawmill."
  "This is the lawless quarry: the server rules about starting a fight do not apply inside the fence. Mind the rocks while the pit is worked."
  "Carry what you make to the traders in town."
  "Vegetable plots"
  "Grow your own cabbages in the dirt plots."
  "Take Cabbage seeds from the crate. Plant Cabbage seeds in an empty plot. When the cabbages are ripe, Harvest Cabbage."
  "Sprouts, then half grown, then ripe: about two minutes. A ripe plot waits for you. One packet gives three cabbages. The crate refills every two minutes."
  "Sell cabbages at the general store on the main street."
  "1. Safe"
  "A cash safe on the crime site."
  "Stand at the safe and Rob the safe. It pays $200 and rests for 60 seconds."
  "A civilian. No police need to be online here."
  "A robbery files a crime report and raises your wanted level."
  "Take the weapon rack next, two steps along."
  "2. Weapon rack"
  "An armory rack holding one rifle."
  "Stand at the rack and Rob the weapon rack to take an AK-74. It rests for 2 minutes."
  "A civilian. No police need to be online here."
  "Armed theft is reported and raises your wanted level."
  "Steal the vehicle at the tyre pile next."
  "3. Getaway"
  "A pile of tyres that stands in for a car theft."
  "Stand at the pile and use Steal the vehicle to get an armoured car. It rests for 10 minutes."
  "A civilian. No police need to be online here."
  "Theft of a vehicle is reported and raises your wanted level."
  "Finish at the police desk: a wanted suspect and a table of evidence."
  "4. Police desk"
  "A practice desk with an ID card and a confiscated key. Real duty is at the police station."
  "Look the table over. For real duty, evidence and the wanted board, walk to the police station on the main street."
  "Nothing here."
  "Clock on at the police station to arrest the suspect you made."
  "Application to the Everon Police"
  "Civil Registry of Everon, Residents on File"
  "%1 %2"
  "Playtest: jail board"
  "Playtest only. Use the action on this board to be jailed for 60 seconds through the real jail path, so you can try the cell, the visit window and the release alone."
  "Wait out the 60 seconds, or try a breakout. The cell, the visit window and the release are the real ones."
  "Welcome to Everon. Here is something to start you off. The town is yours now. The shops, the car lot, the police station and the organization office are all on the town board."
  "Everon is a small island. People here know each other, and they remember faces. Stay honest and you will do well."
  "Case board"
  "Open cases, one column each: the crime, where and when, the suspect, and the evidence pinned against it."
  "Bag what a scene left (casings, footprint cards, dropped items, witness statements), then Pin evidence here. Unpin takes down the last card."
  "On-duty police only. A case closes when the suspect is no longer wanted."
  "The evidence locker keeps every logged bag; the wanted board shows the suspects to the public."
  "Test organisation"
  "Playtest only: a shared organisation for one tester."
  "Use Join test organisation. The first one in founds it and takes the hideout yard. Use Leave organisation to get out again."
  "Nothing. This sign works in the playtest town only."
  "The hideout door is at the end of the cobbled alley: members open it, everyone else is told whose it is."
  "I teach people to survive outside town. Water, food, a fire, a shelter. The weather turns fast on Everon."
  "Police can search it. After a search the room stays shut for about ten minutes."
  "This is Everon, friend. One road around the coast, and this is the only fuel in town. Petrol at the pumps, oil and maps in here. The square is just up the street."
 }
}
