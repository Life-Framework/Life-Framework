  "Thank you. Thank you, really."
  "Sorry, we have only just come off the bus. Is this Saint-Philippe? They said someone would meet us."
  "New arrival"
  "Welcome to town."
  "Where have you come from?"
  "Can I help with anything?"
  "Marius is my brother. He spends his mornings at the cafe and knows everything before the newspaper does."
  "We came over from the mainland long before all this. Now half the street are new faces from the Zone. Good people. Tired people."
  "The van run? Take the yellow van from the post stand, load four mail sacks, drive them to the post office in Meaux and bring my van back. Back in one piece, mind. A wrecked van pays nobody."
  "Letters, parcels, the odd crate of machine parts for the farms. If you want work, the depot pays by the drop. Ask at the counter."
  "Take care now."
  "Anselme Caron. I sort the parcels at the depot, so if your post is late, blame the ferry, not me."
  "Hello, hello. No parcel for you today, I am afraid."
  "No. I have heard what you did. Leave me be."
  "Ah, my friend! Marius made too much soup again. Come by tonight."
  "You. Keep your distance, please."
  "Goodbye."
  "Who is Marius?"
  "Have you lived here long?"
  "Tell me about the van run."
  "What do you do at the depot?"
  "The town anniversary is coming. The mayor has the whole square scrubbed. Bastien does love a speech."
  "Odilon runs the cafe. He keeps the best table for the mayor and pretends he does not."
  "They say the harbor master counts his crates twice since the spring. And somebody has been buying a great deal of sugar. Make of it what you like."
  "See you soon, dear."
  "Good morning. Marius. Forgive me, I only came out for a coffee and a little conversation."
  "Hello, dear. Sit. The coffee here is terrible, but it is hot."
  "I know what you are. I do not speak to people like you."
  "There you are! I was just telling Odilon about you."
  "Oh. Hello. I would rather not chat today."
  "What is happening on the square?"
  "Goodbye."
  "Tell me about the cafe."
  "Heard any gossip?"
  "Everything comes by the ferry. When the weather turns the shelves go bare, and everybody blames me."
  "Quiet, mostly. Since the new families came there is more bread to bake and more faces to learn."
  "Cans, rope, batteries, cigarettes. Half the island comes through my door before noon. Pay at the till and do not lean on the glass."
  "Mind how you go."
  "Pierre Vasseur, general store. If we do not have it, the ferry might bring it on Thursday."
  "Good to see you. The bread came in fresh this morning."
  "You are not welcome at my counter. Go on."
  "My best customer! I put a can of the good coffee aside for you."
  "I have my eye on you. Pay for what you take."
  "Goodbye."
  "Where does your stock come from?"
  "How is the town these days?"
  "What does the store sell?"
  "Bank your pay the day you get it. What sits in your pocket can walk off. What sits with us stays yours."
  "Saint-Philippe gossips faster than the telephone. If you want to know a thing, sit at the cafe and wait."
  "I keep the counter at the First Bank of Everon. Deposits, withdrawals, and listening to the farmers argue about the price of feed."
  "Good day to you."
  "Good day. I am off the counter just now, but I don't bite. Lucien, from the bank."
  "Ah, hello again. Your account is in better shape than most, you know."
  "I count other people's money all day. I will not waste my words on you."
  "There you are! Sit down a minute. The bank can wait."
  "Mm. I remember you. Mind your manners and we will get along."
  "Any advice about money?"
  "Goodbye."
  "What is the town like?"
  "What do you do at the bank?"
  "We never spoke."
  "You did not see me. Now, what are you after?"
  "Vince does not sell that to strangers. Make a name for yourself, then come back."
  "Somebody sold a drill and a charge to the wrong customer. The wrong customer was the police."
  "You have earned it. Here is the drill. Be quiet with it, and it never came from me."
  "Take a look. Cash only."
  "I sell tools to people who do not ask what they are for. Locks are hard and the police are harder. Choose the right tool."
  "Ask nobody about me. Keep to the back streets."
  "Drive safe."
  "Mind the oil. What is wrong with it?"
  "Somebody keeps asking me how to start a car without the key. I tell them to buy the key."
  "Take a look. Cash only."
  "I fix cars. A new battery, a repair kit, the right fuel, and it runs. Most breakdowns are a dead battery."
  "The car lot is on the east side, and the fuel station is down the road. Fill up before you go far."
  "Look after yourself."
  "Come in. Are you hurt?"
  "A lot of cuts from the sawmill this month. The men will not wear gloves."
  "Take a look. Cash only."
  "I patch people up. A bandage stops bleeding. Anything worse, come to me before it gets worse."
  "If you need a bandage and I am not here, the general store keeps dressings by the counter."
  "Stay out of trouble."
  "Officer on duty. Keep your hands where I can see them, and we will get along."
  "We have had burglaries along the main street. If you saw anything, tell us. People here remember faces."
  "Take a look. Cash only."
  "I keep the peace and take the reports. Break into a shop or hurt someone and you will see me again."
  "The station is the building behind me. The town board on the square lists everything else."
  "Take care out there."
  "Morning. Looking for something in particular?"
  "Somebody has been asking whether I keep a safe under the counter. I do not, and I do not keep much cash either."
  "Take a look. Cash only."
  "I run the till and keep the shelves full. Bread, water, apples, dressings. If we do not have it, nobody in Saint-Philippe does."
  "The market square is south of the main street if you want fruit and vegetables. Cars are sold at the lot on the east side."
  "Good day. Mind your money."
  "Good day. Welcome to the bank. How can I help?"
  "A man with no work and a drill in his bag asked me about the vault. I told him the vault is none of my business."
  "Take a look. Cash only."
  "I keep the counter and the accounts. Cash in your pocket is gone when you die. Money in the bank is not. The cash machine on the wall does deposits and withdrawals."
  "The post office is right beside us. The town board on the square lists the rest, and the police station is a short walk up the street."
  "Take care."
  "Hello. New in Saint-Philippe?"
  "People say the police are watching the main street. Burglars are about. Keep your doors locked."
  "Take a look. Cash only."
  "I live here. I get by, as everyone does. The work is simple and the people are decent."
  "The town board on the square shows everything. The post office hires couriers, and the bank is beside it."
  "Come back when you have more."
  "Fresh today. Have a look."
  "The price of apples went up this week. Somebody is hoarding them, I think."
  "Take a look. Cash only."
  "I buy at this stall. Bring me apple juice, fruit, cabbage or honey and I pay cash, the price on the board."
  "The orchard is a short drive out of Saint-Philippe. Pick the apples, press them into juice. Juice pays best here."
  "The car lot in town sells beaters cheap. Check the tires before you sign anything."
  "Cars go into the yard on the hill and parts come out. You can hear the saws from the road. That is all I know, and all I want to."
  "A man buys odd goods behind a barn on the edge of town. Everybody sees who walks out there. Nobody says why."
  "There is a fuel stop out on the road. If you run dry past the farms, that is your only hope."
  "The hardware store has tools. A man with a pick works faster than a man without one."
  "The old barn off the road is not empty at night. Lights, a truck with no plates, a smell like sour mash. I pour what I pour and keep quiet."
  "The taxi stand by the square. Drivers hear everything, but they only tell what pays."
  "That is all I wanted."
  "Go on."
  "The north shore of Black Lake has pike, big ones. Few people bother with it, which is why the pike are big."
  "Men play chess on the square for small stakes. Sit down, lose gracefully, and they will tell you everything."
  "The clinic is short of hands, and always has been. If you can stay calm around blood, ask there."
  "Somebody fishes the cove on the bay every dusk. A quiet type. He comes back with a full bucket and tells nobody where he goes."
  "The Chotain pub has a back room. Cards on Friday nights, I am told, and the barkeeper keeps that door himself. I only repair watches."
  "There is a range at the edge of town where people practice. Mind the flags, and mind the neighbors."
  "Seed and feed sells everything a farm needs. Ask the clerk what is moving this week. He tells you if you buy something."
  "The wholesale counter at the dock buys in bulk. If you have crates to sell, do not take less than the market gives."
  "The woodlot behind the town has trees marked for cutting. A man with an axe can make an honest day of it."
  "That is all I wanted."
  "Go on."
  "The farm compound keeps its gate shut and its dogs loose. A lot of traffic for a farm that grows nothing."
  "The dock warehouse has its lights on after the last boat. Crates go in light and come out heavy. I just walk past."
  "Up by the hilltop mast somebody left a camp. Fresh boot prints, a cold fire. You can see the whole valley from there."
  "Cars go into the scrapyard and the plates do not come out. Ask yourself why a scrapyard keeps a night man."
  "Trucks roll into the north east yard at two in the morning with the lights off. Same trucks, never in daylight."
  "That is all I wanted."
  "Go on."
  "The church is open to anyone. The bell rings the hour, and the priest knows more about this town than the baker does."
  "The harbor master keeps a tally of every crate that lands. Honest work, if you can count and stay awake."
  "Set up at the market on a good morning and the whole town buys. Bread, honey, apples, whatever you carry."
  "The mine at Coalman's Brow takes anyone with a pick and a strong back. The coal goes down to the power plant on the edge of town."
  "Pick apples at the orchard, press them for juice, and the market buys what you carry. I did it myself the summer my knees went."
  "The post office wants couriers. Walk a parcel across town, earn a little, and learn every street on the way."
  "There is a pond past the houses where the carp sit lazy at noon. I fished it for years and never needed a boat."
  "The sawmill is always short a pair of hands. Logs come in from the woodlot, boards go out, and the foreman asks few questions."
  "The smokehouse by the dock pays a fair price for fish. Bring it fresh and nobody will haggle."
  "That is all I wanted."
  "Go on."
  "Any talk in the cafe lately?"
  "Mind how you go."
  "Hugo Valmy. I help people who have more than they need meet people who need more than they have. Sit if you like, the coffee is honest, but I do not talk business with a face I do not know."
  "Goodbye."
  "I opened the red crate on the quay."
  "I took what was in the crate to the police."
  "I found a buyer for what was in the crate."
  "So you opened the red crate. If you still have what was in it, I know a buyer: cash on the spot, no questions. He keeps to the lanes and the quay after dark. The police will only thank you."
  "Then we have never met, and you have never seen the red crate. A pleasure doing no business with you."
  "You walked it to the desk. Fine. Mind the coast road at night, friend. It is long, and it is short of lamps."
  "Good day to you."
  "Good day. Take what you need from the shelves and pay at the till."
  "Pick the goods up yourself, then pay at any till before you leave. You get a receipt. Walk out without paying and the alarm goes off."
  "I have told you what I know today. Ask again tomorrow."
  "Nothing new. Ask me tomorrow."
  "Food and household goods on the shelves, drinks in the chilled counter. What runs out comes back from the stockroom every few minutes."
  "Stop! You did not pay for that! Come back here!"
  "Mind the crane."
  "Not now. Your pockets are full. Your money is still yours."
  "You already have one. Keep your money."
  "That is not enough. Come back with the full amount."
  "Marcel, tally clerk. I count what comes off the ships and I write down what the customs man wants written. Funny thing. Container nine is short this week."
  "Here. Brass, on a red string. Container nine, back row, past the crane. Take what is in it, lock it up after. The books will say it never came."
  "Not while the customs man is here. Come back when your pockets are full and the yard is quiet."
  "Four hundred dollars, and it stays short on the books. You carry the key, you take what is in it, and in a while it fills up again. I never saw you."
  "Container nine is short?"
  "Goodbye."
  "I need to think about it."
  "Here is the four hundred."
