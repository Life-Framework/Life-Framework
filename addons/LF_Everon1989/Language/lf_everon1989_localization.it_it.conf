 Texts {
  "Everon Life"
  "FIRST BANK OF EVERON"
  "Apple harvest"
  "Walk to the orchard at the edge of town."
  "Go to the orchard"
  "Pick 5 apples from the trees."
  "Pick 5 apples"
  "Pick apples in the orchard and press them into juice."
  "Press your apples into a bottle of juice at the juicer by the stall."
  "Press apple juice"
  "Found a crew"
  "Register a crew with your friends and raise its flag."
  "Walk to the registry cabin in Saint-Philippe: the clerk takes a crew name, and the flag wall shows who holds the island."
  "Go to the registry cabin"
  "Cast your line and land a fish; the dock buyer pays for every one."
  "Catch a fish"
  "Fishing"
  "Cast a line at the pond or the cove and sell the catch at the dock."
  "Buy a fishing rod at the seed and feed store."
  "Buy a fishing rod"
  "Walk to the nearest fishing spot."
  "Go to the water"
  "Buy an axe at the hardware store."
  "Buy an axe"
  "Go back to the woodlot and fell a tree; every log levels Lumberjack."
  "Fell a tree"
  "Take the lumberjack job at the woodlot desk."
  "Take the lumberjack job"
  "Lumber"
  "Fell trees at the woodlot and sell the timber in town."
  "Clock in at the desk; duty pay comes while you are on shift."
  "Clock in"
  "Walk to the duty desk at the clinic."
  "Go to the clinic desk"
  "Medic duty"
  "Clock in at the clinic and answer calls for a wage. Emergency calls come in on the board while you are on duty."
  "Take a car out of your garage: the mine is up on the brow and the iron buyer is at the dock; any car will do."
  "Take your car out"
  "Drive up to the mine on Coalman's Brow."
  "Go to the mine"
  "Take the miner job at the desk by the mine on Coalman's Brow, south-west of the square."
  "Take the miner job"
  "Mining run"
  "Swing at the rust-veined rocks and pick up 15 iron nuggets, one full furnace load; every piece levels Mining, and level 4 opens the East Rise coal seam."
  "Mine 15 iron nuggets"
  "Buy a pickaxe ($150) at the miner's supply counter beside the mine desk."
  "Buy a pickaxe"
  "Swing a pickaxe on Coalman's Brow, smelt the nuggets at the mine and sell the bars at the dock."
  "Drive the bars down to the iron counter in the dock wholesale warehouse; it pays $20 a bar, and the mine adds $180 for your first run."
  "Sell your bars at the dock"
  "Smelt the nuggets in the mine furnace: 3 nuggets make a bar, so your 15 make 5 bars in one 4-minute run."
  "Smelt your bars"
  "Walk to the counter in the town hall and pick the perk for your trade."
  "Go to the labor office"
  "Pick a perk"
  "Once a trade reaches level 10, choose its perk at the labor office."
  "Clock in at the desk; duty pay comes while you are on shift."
  "Clock in"
  "Walk to the duty desk at the police station."
  "Go to the police desk"
  "Police duty"
  "Clock in at the police station and patrol for a wage."
  "The van needs a driver's license: get one at the license desk for $100."
  "Get a driver's license"
  "Postal van run"
  "Drive the post van from Saint-Philippe to Meaux and back with the mail sacks."
  "Take the postal van run, load the sacks, drive to Meaux, unload, and hand the run in back here."
  "Do a postal run"
  "Walk to the post-box stand on the side wall of the parcel kiosk."
  "Go to the post stand"
  "A rumor of easy money"
  "Hear the first word on crime from the fence, and know the risk."
  "Walk to the fence's yard in Saint-Philippe and listen; the pay is high and so is the risk."
  "Find the fence"
  "Truck check"
  "Pass the truck check at the truck yard and haul freight for good pay."
  "Drive to the truck yard in the north-east and ask the examiner for the truck check; it costs $300."
  "Go to the truck yard"
  "The anniversary"
  "The bells ring and the town falls quiet for those the Zone took."
  "Three years ago they walked out of the night with what they could carry. We remember each of them. Stand with us a moment."
  "Father Étienne Morel"
  "The town clerk"
  "Saint-Philippe bus line"
  "Car lot"
  "Clinic"
  "Harbor"
  "Wheat farm"
  "Fuel station"
  "Coalman's Brow mine"
  "Police station"
  "Shop street"
  "Town hall square"
  "Timber yard"
  "The man is not buying here, not tonight."
  "You have nothing he drinks or smokes."
