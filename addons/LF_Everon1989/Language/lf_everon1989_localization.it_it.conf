  "You are new on Everon and carry no papers. Walk south from the hostel to the town hall on the square in Saint-Philippe and talk to the town clerk: he files your papers, hands you your ID card and a welcome pack, and tells you where your starter car waits."
  "Then the route is: take your car out at the garage counter beside the town hall, drive to the orchard east of town and pick six apples, press them into juice at the stall, and sell the juice at the market. A waypoint with the distance shows the way to each step. For your first minutes nobody can rob you."
  "You start with %1 in the bank. Cash in your pocket is lost when you die; money in the bank is not. Put cash in or take it out at an ATM (by the bank, on the east side, on the harbor) or at the bank teller."
  "Once the market sale is done, press F2 and open What to do next: it lists the starter runs, each with a Start button, and shows the one you are on. The notice board on the square lists every shop and service in Saint-Philippe, each with a waypoint button."
  "Police officers and medics are players. Anyone can sign on: press F at the duty desk in the police station on the main street, or in the clinic beside the taxi stand, and clock in. Pay is handed over in cash when you clock out."
  "Alpha: progress can be wiped, with 24 hours' notice on Discord"
