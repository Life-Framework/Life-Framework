  "Hold up a shop, break into a vault or force a door and the police are told. Your wanted level goes up, and they come looking for you. You leave marks at the scene, and officers read them."
  "A new arrival gets a short grace: no hold-up, robbery or arrest at first. After that you carry the risk."
  "If someone points a gun at you, do as they say and report it afterwards. Your life comes first."
  "If you turn to crime"
  "Anyone may take courier work. Each run you finish counts. After a few, the post office offers fuel delivery, and after more than that, taxi work."
  "The town board says who else is hiring. You sign up for a job at its own workplace, so go there in person."
  "If you are out of work and have little in the bank, the town pays a small benefit now and then."
  "Work in town"
  "When an officer books you, they fill in a charge sheet at the booking desk in the police station. They check each charge and sign it, and the sheet offers you the fine or the time. The paper is the record: what is on it is what you answer for."
  "Pay now or take the cell. A fine is paid at the booking desk, and it goes to the town, never to the officer. Take the time instead and you serve it in the Saint-Philippe holding cell: 15 minutes at most, counted while you are online."
  "Violent charges and robbery are jail only. Cooperate with the officer and the time is shorter. Bail is $150 for each minute you have left, with a minimum of $500."
  "Some road charges can get your driver's license seized for a number of days. The license desk in the station porch turns you away until the days run out."
  "Law and order"
  "Guns need a firearm permit. Apply at the license desk. The permit takes some hours to be made ready, so come back to the desk to collect it. You are refused if the police want you, and the police can take a permit away."
  "The gun counters sell rifles, pistols and ammunition to permit holders only. Scopes, holsters and pouches are sold to anyone."
  "Do not hurt anyone without a reason. If you are being arrested or robbed, see it through: leaving to dodge it is not allowed. When you die you forget what led to it, and you do not go after the killer."
  "Settle quarrels in person and in good faith. If that fails, ask staff."
  "The law and the permit"
  "The hospital treats the sick and the hurt. If you go down and no one reaches you, you wake up in the hospital with a treatment bill. Pay it in cash at the hospital desk."
  "Medics treat people in the street and admit them to the ward. Anyone may sign on: clock in at the medic duty desk in the clinic and take the medic kit. Saline and morphine join the kit as you rise in rank."
  "The hospital till has an alarm. Rob it and the police are called."
  "The hospital"
